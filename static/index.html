<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Life Coach AI — แพลตฟอร์มสนทนากับ AI Agent ที่เชี่ยวชาญด้านการเขียน ค้นหาตัวตน และแนวทางชีวิต">
    <title>Life Coach AI — Your Personal AI Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">Life Coach AI</span>
                </div>
                <button class="btn-new-chat" id="btnNewChat" title="New Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="sidebar-sessions" id="sessionList"></div>
            <div class="sidebar-footer">
                <div class="sidebar-footer-info">
                    <span class="footer-dot"></span>
                    <span>MVP — Single User</span>
                </div>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h1 class="chat-title" id="chatTitle">Life Coach AI</h1>
                <div class="header-actions">
                    <button class="btn-icon" id="btnDeleteSession" title="Delete Chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-2 14H7L5 6"/>
                            <path d="M10 11v6"/>
                            <path d="M14 11v6"/>
                            <path d="M9 6V4h6v2"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">✦</div>
                    <h2>สวัสดี! ยินดีต้อนรับสู่ Life Coach AI</h2>
                    <p>ผมคือผู้ช่วย AI ที่เชี่ยวชาญด้านการเขียน ค้นหาตัวตน และแนวทางชีวิต</p>
                    <div class="welcome-cards">
                        <button class="welcome-card" data-prompt="ช่วยสอนเทคนิคการเขียนเรื่องสั้นให้หน่อย">
                            <span class="card-icon">✍️</span>
                            <span class="card-title">สอนเขียนหนังสือ</span>
                            <span class="card-desc">เทคนิคการเขียนเรื่องสั้น</span>
                        </button>
                        <button class="welcome-card" data-prompt="ช่วยตั้งคำถามเพื่อค้นหาตัวตนของฉันหน่อย">
                            <span class="card-icon">🔍</span>
                            <span class="card-title">ค้นหาตัวตน</span>
                            <span class="card-desc">คำถามกระตุ้นความคิด</span>
                        </button>
                        <button class="welcome-card" data-prompt="ช่วยแนะนำแนวทางการวางแผนชีวิตให้หน่อย">
                            <span class="card-icon">🧭</span>
                            <span class="card-title">แนวทางชีวิต</span>
                            <span class="card-desc">การวางแผนและเป้าหมาย</span>
                        </button>
                        <button class="welcome-card" data-prompt="สร้างข้อสอบ multiple choice เรื่องการพัฒนาตนเอง">
                            <span class="card-icon">📝</span>
                            <span class="card-title">ข้อสอบ MCQ</span>
                            <span class="card-desc">ทดสอบความรู้ของคุณ</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-container">
                    <textarea id="messageInput" placeholder="พิมพ์ข้อความ..." rows="1" autofocus></textarea>
                    <button class="btn-send" id="btnSend" title="Send" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">กด Enter เพื่อส่ง • Shift+Enter ขึ้นบรรทัดใหม่</p>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="mcqModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">📝 แบบทดสอบ</h3>
                <button class="modal-close" id="btnCloseModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="mcq-question" id="mcqQuestion"></p>
                <div class="mcq-options" id="mcqOptions"></div>
                <div class="mcq-result" id="mcqResult" style="display: none;">
                    <div class="result-icon" id="resultIcon"></div>
                    <p class="result-text" id="resultText"></p>
                    <div class="result-explanation" id="resultExplanation"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal-action" id="btnSubmitAnswer" disabled>ส่งคำตอบ</button>
                <button class="btn-modal-secondary" id="btnCloseResult" style="display: none;">ปิด</button>
            </div>
        </div>
    </div>

    <div class="loading-indicator" id="loadingIndicator" style="display: none;">
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
